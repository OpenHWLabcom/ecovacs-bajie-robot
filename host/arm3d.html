<script>
var MIL=Math.PI/180;
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.005, 200);
camera.up.set(0,0,1);
var LOWMEM=/[?&]lowmem=1\b/.test(location.search);   // 嵌入主控制台/采集页时降显存，避免 Jetson OOM
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:!LOWMEM,alpha:true,powerPreference:LOWMEM?'low-power':'default'});
var MAXPR=LOWMEM?1.25:Math.min(2,devicePixelRatio||1);
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(MAXPR); renderer.outputEncoding=THREE.sRGBEncoding; renderer.setClearAlpha(0);
scene.add(new THREE.HemisphereLight(0xbfe6ff,0x12202b,1.35));
var L1=new THREE.DirectionalLight(0xffffff,1.05); L1.position.set(2,-3,4); scene.add(L1);
var L2=new THREE.DirectionalLight(0x35c8ff,0.9); L2.position.set(-3,2,-1); scene.add(L2);
var L3=new THREE.DirectionalLight(0x66ddff,0.6); L3.position.set(0,3,-3); scene.add(L3);
/* 地面网格（科技感） */
var g=new THREE.GridHelper(6,60,0x1e6a86,0x143342); g.material.transparent=true; g.material.opacity=0.45; g.rotation.x=Math.PI/2; scene.add(g);
/* 🚶 底盘根节点(行走) —— 机械臂整链挂在它下面，移动它=机器人行走 */
var robot=new THREE.Group(); scene.add(robot);
var BASE={x:0,y:0,yaw:0};
function applyBase(){ robot.position.set(BASE.x,BASE.y,0); robot.rotation.z=BASE.yaw; if(window.__a3dWalkHud) window.__a3dWalkHud(); }
/* 行走圆盘（可拖动）+ 外圈：位于底盘中心，随底盘移动 */
var walkDisc=new THREE.Mesh(new THREE.CircleGeometry(0.36,56), new THREE.MeshBasicMaterial({color:0x22b8d8,transparent:true,opacity:0.10,side:THREE.DoubleSide,depthWrite:false})); walkDisc.position.z=0.001; robot.add(walkDisc);
var walkRim=new THREE.Mesh(new THREE.RingGeometry(0.34,0.355,64), new THREE.MeshBasicMaterial({color:0x2fd0ff,side:THREE.DoubleSide,transparent:true,opacity:0.55})); walkRim.position.z=0.002; robot.add(walkRim);
var controls=new THREE.OrbitControls(camera,renderer.domElement);

  window.addEventListener('unhandledrejection', function(e){ try{ be('REJ|'+((e.reason&&e.reason.message)||e.reason||'')); }catch(x){} });
  setTimeout(function(){ be('LOAD|'+JSON.stringify(st())); }, 2500);
  setInterval(function(){ try{ if(window.LC&&LC.demoOn) be('TICK|'+JSON.stringify(st())); }catch(e){} }, 1000);
  document.addEventListener('click', function(e){ var id=(e.target&&e.target.id)||'(x)'; be('CLICK|'+id+'|'+JSON.stringify(st())); }, true);
  window.addEventListener('keydown', function(e){
    if(e.target&&/input|textarea|select/i.test((e.target.tagName||''))) return;
    var k=(e.key||'').toLowerCase();
    if(k==='l'&&window.lcDebug){ be('KEYL'); if(window.LC&&LC.demoOn){ lcDebug.stop(); } else { lcDebug.demo(); } e.preventDefault(); }
  });
})();
</script>


<script>
/* v58: 抓取日志面板（左区）——轮询 Jetson 代理 :8794/log */
(function(){
  var el=document.getElementById('glbody'), st=document.getElementById('glst'), btn=document.getElementById('glrun');
  if(!el) return;
  var base='http://'+location.hostname+':8794';
  var lastN=0, timer=null;
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function paint(d){
    var lines=(d.log||[]);
    st.textContent = d.running ? ('运行中 '+ (d.dt||0) +'s') : (d.ok===true?'✅ 成功':(d.ok===false?'✗ 失败':'待命'));
    st.style.color = d.running ? '#8ff0d0' : (d.ok===true?'#7dffc2':(d.ok===false?'#ff9a9a':'#7fd0c0'));
    if(lines.length!==lastN){
      el.innerHTML = lines.map(function(l){
        var cls='';
        if(/✅|成功/.test(l)) cls='ok'; else if(/✗|失败|ERR|collision/.test(l)) cls='bad';
        else if(/策略|翻立|绕行|滑脱/.test(l)) cls='warn'; else if(/^\[/.test(l)) cls='dim';
        return '<div class="'+cls+'">'+esc(l)+'</div>';
      }).join('');
      lastN=lines.length; el.scrollTop=el.scrollHeight;
    }
  }
  function tick(){
    fetch(base+'/log',{cache:'no-store'}).then(function(r){return r.json();}).then(paint).catch(function(){ st.textContent='代理未连上'; st.style.color='#ff9a9a'; });
  }
  btn.onclick=function(){
    btn.disabled=true; btn.textContent='启动中…';
    fetch(base+'/start',{cache:'no-store'}).then(function(r){return r.json();}).then(function(){ btn.textContent='▶ 抓取'; btn.disabled=false; tick(); })
      .catch(function(){ btn.textContent='▶ 抓取'; btn.disabled=false; });
  };
  timer=setInterval(tick, 1500); tick();
})();
</script>


<script>
/* v60: 面板拖动（位置记忆到 localStorage: a3dpanels） */
(function(){
  var ids=['walk','data','glog','campip','campip3','limstat'];
  var KEY='a3dpanels', saved={};
  try{ saved=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ saved={}; }
  ids.forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    if(saved[id]){ el.style.left=saved[id][0]+'px'; el.style.top=saved[id][1]+'px'; el.style.right='auto'; el.style.bottom='auto'; }
    var drag=null;
    el.addEventListener('pointerdown', function(e){
      if(e.target.closest('button')) return;            /* 按钮不拖 */
      try{ e.preventDefault(); }catch(x){}              /* 阻止原生图片拖拽 */
      drag={x:e.clientX,y:e.clientY,r:el.getBoundingClientRect(),moved:false};
      try{ el.setPointerCapture(e.pointerId); }catch(x){}
      el.style.zIndex=30; e.stopPropagation();
    });
    el.addEventListener('pointermove', function(e){
      if(!drag) return;
      var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      if(!drag.moved && Math.sqrt(dx*dx+dy*dy)<4) return;
      drag.moved=true;
      el.style.left=(drag.r.left+dx)+'px'; el.style.top=(drag.r.top+dy)+'px';
      el.style.right='auto'; el.style.bottom='auto';
      e.stopPropagation();
    });
    function end(e){
      if(!drag) return;
      var moved=drag.moved; drag=null;
      if(moved){ var r=el.getBoundingClientRect();
        saved[id]=[Math.round(r.left),Math.round(r.top)];
        try{ localStorage.setItem(KEY, JSON.stringify(saved)); }catch(x){}
      }
    }
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  });
})();
</script>

<script>
/* 🖱 右侧标签可拖动/自定义位置（保存到 localStorage；Shift+双击复位） */
(function(){
  var KEY='a3dSideBtnPos';
  var ids=['bgbtn','limbtn','guardbtn','modbtn','wavebtn','headfixbtn','headfixrealbtn'];
  var saved={}; try{ saved=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
  function place(b,id,x,y){
    b.classList.add('dragged');
    b.style.left=Math.max(0,Math.min(window.innerWidth-160,x))+'px';
    b.style.top=Math.max(0,Math.min(window.innerHeight-42,y))+'px';
  }
  function setup(b,id){
    var drag=null;
    function move(e){
      if(!drag) return;
      var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      if(!drag.moved && Math.hypot(dx,dy)<4) return;
      drag.moved=true; b.__dragMoved=true;
      b.classList.add('dragged');
      b.style.left=Math.max(0,Math.min(window.innerWidth-160,drag.l+dx))+'px';
      b.style.top=Math.max(0,Math.min(window.innerHeight-42,drag.t+dy))+'px';
      e.preventDefault();
    }
    function end(e){
      if(!drag) return;
      document.removeEventListener('pointermove',move,true);
      document.removeEventListener('pointerup',end,true);
      document.removeEventListener('pointercancel',end,true);
      if(drag.moved){
        saved[id]=[Math.round(parseFloat(b.style.left)),Math.round(parseFloat(b.style.top))];
        try{ localStorage.setItem(KEY,JSON.stringify(saved)); }catch(x){}
        e.preventDefault(); e.stopPropagation();
      }
      drag=null;
    }
    b.addEventListener('pointerdown',function(e){
      if(e.button!==0) return;
      var r=b.getBoundingClientRect();
      drag={x:e.clientX,y:e.clientY,l:r.left,t:r.top,moved:false};
      b.__dragMoved=false;
      try{ b.setPointerCapture(e.pointerId); }catch(x){}
      document.addEventListener('pointermove',move,true);
      document.addEventListener('pointerup',end,true);
      document.addEventListener('pointercancel',end,true);
    });
    b.addEventListener('click',function(e){ if(b.__dragMoved){ b.__dragMoved=false; e.preventDefault(); e.stopPropagation(); } },true);
    if(saved[id]) place(b,id,saved[id][0],saved[id][1]);
    b.addEventListener('dblclick',function(e){ if(!e.shiftKey) return; delete saved[id]; try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(x){} b.classList.remove('dragged'); b.style.left=''; b.style.top=''; e.preventDefault(); });
  }
  ids.forEach(function(id){ var b=document.getElementById(id); if(b) setup(b,id); });
})();
</script>

<script>
/* 模拟视图内快捷操作：优先复用父页面(index.html)的按钮逻辑；独立打开时本地执行 */
(function(){
  function parentClick(id){
    try{ if(window.parent && window.parent!==window){ var b=window.parent.document.getElementById(id); if(b){ b.click(); return true; } } }catch(e){}
    return false;
  }
  var fs=document.getElementById('qfs');
  fs.onclick=function(){ if(document.fullscreenElement){ document.exitFullscreen(); } else { var el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); } };
  document.getElementById('qready').onclick=function(){ if(parentClick('arm6ReadySim')) return; if(window.bReady) bReady.click(); };
  document.getElementById('qsync').onclick=function(){
    var self=this, label=self.textContent; self.textContent='⏳ 同步中…';
    fetch('http://'+location.hostname+':8796/joints',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      if(!j||!j.rad) throw new Error('no joints');
      Q=j.rad.slice(0,6);
      if(j.lift!=null) LIFT=Math.max(0,Math.min(0.44,+j.lift));
      if(j.pitch!=null) PITCH=Math.max(0,Math.min(1.31,+j.pitch));
      if(j.finger!=null) GRIP=Math.max(0,Math.min(0.69,+j.finger));
      userEdited=false; liftEdited=false; apply(); syncAll();
      try{ if(window.parent&&window.parent!==window){ if(window.parent.arm6On3DJoints) window.parent.arm6On3DJoints(Q.slice()); if(window.parent.arm6On3DLift) window.parent.arm6On3DLift(LIFT); if(window.parent.arm6On3DGrip) window.parent.arm6On3DGrip(GRIP/GRIP_MAX); if(window.parent.arm6Push3D) window.parent.arm6Push3D(); } }catch(e){}
      self.textContent='✅ 已同步'; setTimeout(function(){ self.textContent=label; },1500);
    }).catch(function(){ self.textContent='❌ 桥未连'; setTimeout(function(){ self.textContent=label; },1800); });
  };
  document.getElementById('qexec').onclick=function(){ if(parentClick('arm6Exec')) return; if(window.arm3dExec) window.arm3dExec(); };
  document.getElementById('qstop').onclick=function(){ try{ a3dPost('/jog',{stop:true}); }catch(e){} if(parentClick('arm6Halt')) return; try{ a3dSend('stop_all',{}); }catch(e){} };
})();
</script>
