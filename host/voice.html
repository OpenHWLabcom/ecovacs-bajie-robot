<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>八界 · 语音控制</title>
<style>
  :root{--bg:#0b1120;--panel:#121a2c;--line:#1e2a44;--txt:#e6edf7;--muted:#8aa0c0;--accent:#22d3ee;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:radial-gradient(900px 500px at 70% -10%,#16233d,var(--bg));color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 34px;min-height:100%}
  h1{font-size:19px;margin:6px 0 4px}
  h1 b{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .mic{width:150px;height:150px;border-radius:50%;margin:14px auto;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#16233d,#0e1626);border:2px solid var(--line);font-size:56px;user-select:none;transition:.15s}
  .mic.rec{border-color:var(--err);box-shadow:0 0 0 12px rgba(239,68,68,.12),0 0 40px rgba(239,68,68,.4);background:linear-gradient(180deg,#3a1620,#1a0d12)}
  .mic:active{transform:scale(.97)}
  .status{text-align:center;font-size:14px;color:var(--muted);min-height:20px}
  .heard{text-align:center;font-size:18px;font-weight:600;margin:10px 0;min-height:26px}
  .res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:10px 0;font-size:13.5px}
  .res .a{color:var(--ok)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
  .grid button,.row2 button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 6px;font-size:14px;font-family:inherit}
  .grid button:active,.row2 button:active{background:var(--accent);color:#012}
  .row2{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}
  input{background:#0c1424;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:15px;width:100%;font-family:inherit}
  .t{color:var(--muted);font-size:11.5px;margin-top:6px;text-align:center}
  .log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);margin-top:14px;max-height:180px;overflow:auto;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 <b>八界</b> · 语音控制</h1>
  <div class="sub">按住下方麦克风说话，松开即执行（支持中文）</div>

  <div class="mic" id="mic">🎤</div>
  <div class="status" id="status">点一下开始说话</div>
  <div class="heard" id="heard"></div>
  <div class="res" id="res" style="display:none"></div>

  <div class="grid">
    <button data-cmd="前进">⬆️ 前进</button>
    <button data-cmd="停止">⏹ 停止</button>
    <button data-cmd="挥手打招呼">👋 招手</button>
    <button data-cmd="左转">↪️ 左转</button>
    <button data-cmd="右转">↩️ 右转</button>
    <button data-cmd="拍照">📷 拍照</button>
    <button data-cmd="抬头">🔭 抬头</button>
    <button data-cmd="低头">🔽 低头</button>
    <button data-cmd="回充">🔌 回充</button>
  </div>

  <div class="row2">
    <input id="txt" placeholder="或直接输入指令，如：前进 / 说你好" />
    <button id="send">发送</button>
  </div>
  <div class="t">需要 HTTPS（浏览器麦克风要求）· 本页已 HTTPS</div>
  <div class="log" id="log"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const logEl=$("log");
function log(m,c){ const d=new Date(); const t=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
  const div=document.createElement("div"); div.textContent=`[${t}] ${m}`; if(c) div.style.color=c; logEl.appendChild(div); logEl.scrollTop=logEl.scrollHeight; }

async function sendCmd(text){
  if(!text || !text.trim()) return;
  $("heard").textContent="「"+text+"」";
  $("status").textContent="发送中…";
  try{
    const r=await fetch("/cmd",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text})});
    const j=await r.json();
    $("res").style.display="block";
    $("res").innerHTML = j.ok ? `✅ <span class="a">${j.detail||j.action}</span>` : `❌ ${j.error}`;
    $("status").textContent="完成："+ (j.detail||j.action||"");
    log("→ "+text+"  ⇒ "+(j.detail||j.action||""),"#22c55e");
  }catch(e){ $("status").textContent="发送失败"; log("发送失败 "+e.message,"#ef4444"); }
}

/* 快速指令按钮 */
document.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>sendCmd(b.dataset.cmd));
$("send").onclick=()=>{ sendCmd($("txt").value); $("txt").value=""; };
$("txt").addEventListener("keydown",e=>{ if(e.key==="Enter") $("send").click(); });

/* 语音识别 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recognizing=false;
function setup(){
  if(!SR){ $("status").textContent="此浏览器不支持语音识别（可用下方文字/快捷指令）"; log("无 SpeechRecognition"); return null; }
  const r=new SR(); r.lang="zh-CN"; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  r.onstart=()=>{ recognizing=true; $("mic").classList.add("rec"); $("status").textContent="正在聆听…"; $("heard").textContent=""; };
  r.onresult=(e)=>{ let fin="",intr=""; for(const res of e.results){ if(res.isFinal) fin+=res[0].transcript; else intr+=res[0].transcript; } $("heard").textContent=(fin||intr); if(fin){ $("status").textContent="识别完成"; setTimeout(()=>sendCmd(fin.trim()),150); } };
  r.onerror=(e)=>{ $("status").textContent="识别错误："+e.error; log("识别错误 "+e.error,"#ef4444"); recognizing=false; $("mic").classList.remove("rec"); };
  r.onend=()=>{ recognizing=false; $("mic").classList.remove("rec"); if($("status").textContent==="正在聆听…") $("status").textContent="点一下开始说话"; };
  return r;
}
$("mic").onclick=()=>{
  if(!rec) rec=setup();
  if(!rec) return;
  if(recognizing){ rec.stop(); return; }
  if(window.isSecureContext===false){ $("status").textContent="麦克风需要 HTTPS"; }
  try{ rec.start(); }catch(e){ log("start 失败 "+e.message,"#ef4444"); }
};
log("就绪 · 八界 语音控制");
if(!window.isSecureContext) log("⚠ 非安全上下文，麦克风可能不可用","#f59e0b");
</script>
<script src="nav.js"></script>
</body>
</html>
